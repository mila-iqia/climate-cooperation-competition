[project]
name = "Rice_JAX"
version = "0.1.2"
description = "A high-performance implementation of the Rice-N climate-economy model in JAX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jaxnasium[algs]>=0.1.0",
    "jax[cuda13]",
    "matplotlib>=3.7.4",
    "optimistix>=0.1.0",
    "pyyaml>=6.0.2",
    "tqdm>=4.67.1",
    "wandb>=0.19.10",
    "tyro",
    "pandas>=3.0.5",
    "pyarrow>=18.0.0",
    "distrax>=0.1.8",
]

[tool.uv.sources]
jaxnasium = { git = "https://github.com/ponseko/jaxnasium.git", branch = "v1" } 

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["rice_jax"]
include-package-data = true

[tool.hatch.build.targets.wheel]
packages = ["rice_jax"]
package-data = {"rice_jax" = ["config_yamls/*.yaml", "config_yamls/*.yml", "region_yamls/**/*.yml", "region_yamls/**/*.yaml"]}

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
combine-as-imports = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
